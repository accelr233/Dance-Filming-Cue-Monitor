<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>歌曲提示词库 — Dance Filming Cue Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e1117; --surface: #161b22; --surface2: #1e242d;
      --border: rgba(255,255,255,.09); --text: #e6edf3; --muted: #8b949e;
      --accent: #ffcc4d; --accent-2: #42d3a5; --danger: #ff6b6b;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
    .page { max-width: 640px; margin: 0 auto; padding: 0 16px 60px; }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 0 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 20px; position: sticky; top: 0;
      background: var(--bg); z-index: 20;
    }
    .back-btn {
      background: rgba(255,255,255,.07); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    }
    .back-btn:hover { background: rgba(255,255,255,.12); }
    .topbar h1 { font-size: 18px; font-weight: 800; flex: 1; }
    .admin-btn {
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(255,255,255,.05); color: var(--muted);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .admin-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,204,77,.1); }

    /* Search */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-family: inherit;
      font-size: 16px; padding: 13px 16px 13px 44px; outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent-2); }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 18px; pointer-events: none; opacity: .5;
    }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); font-size: 18px;
      cursor: pointer; padding: 4px; display: none;
    }

    /* Admin toolbar */
    .admin-toolbar {
      display: none; align-items: center; gap: 10px;
      padding: 10px 14px; background: rgba(255,204,77,.07);
      border: 1px solid rgba(255,204,77,.2); border-radius: 10px;
      margin-bottom: 14px;
    }
    .admin-toolbar.visible { display: flex; }
    .admin-toolbar span { font-size: 13px; color: var(--accent); font-weight: 600; flex: 1; }
    .btn-add-song {
      padding: 8px 14px; border-radius: 8px; border: none;
      background: var(--accent); color: #101418; font-size: 14px;
      font-weight: 700; cursor: pointer;
    }

    /* Status / empty */
    .status-msg { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 15px; }
    .status-msg .emoji { font-size: 36px; display: block; margin-bottom: 10px; }

    /* Song card */
    .song-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; margin-bottom: 12px;
    }
    .song-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; cursor: pointer;
      transition: background .15s;
    }
    .song-header:hover { background: rgba(255,255,255,.03); }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song-artist { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .song-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ver-count {
      font-size: 12px; padding: 3px 9px; border-radius: 999px;
      background: rgba(66,211,165,.12); color: var(--accent-2);
      border: 1px solid rgba(66,211,165,.2); white-space: nowrap;
    }
    .expand-icon { color: var(--muted); font-size: 14px; transition: transform .2s; }
    .song-card.open .expand-icon { transform: rotate(180deg); }
    .song-card.open .song-header { border-bottom: 1px solid var(--border); }

    /* Admin song actions */
    .song-admin-row {
      display: none; gap: 8px; padding: 10px 16px;
      background: rgba(255,204,77,.04); border-bottom: 1px solid var(--border);
    }
    .song-admin-row.visible { display: flex; }

    /* Versions list */
    .versions-list { display: none; }
    .song-card.open .versions-list { display: block; }

    .version-item {
      padding: 14px 16px; border-top: 1px solid var(--border);
      display: grid; gap: 8px;
    }
    .version-item:first-child { border-top: none; }
    .version-header { display: flex; align-items: flex-start; gap: 10px; }
    .version-tags { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .tag {
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255,255,255,.05);
      color: var(--muted); white-space: nowrap;
    }
    .tag.choreo { border-color: rgba(255,204,77,.3); color: var(--accent); background: rgba(255,204,77,.08); }
    .tag.label  { border-color: rgba(66,211,165,.3); color: var(--accent-2); background: rgba(66,211,165,.08); }
    .version-date { font-size: 11px; color: var(--muted); white-space: nowrap; margin-top: 3px; }
    .cue-preview {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      color: var(--muted); line-height: 1.7; background: rgba(0,0,0,.25);
      border-radius: 8px; padding: 10px 12px; white-space: pre-wrap;
      max-height: 120px; overflow: hidden; position: relative;
    }
    .cue-preview.expanded { max-height: none; }
    .cue-preview-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 32px;
      background: linear-gradient(transparent, #0d1117);
      pointer-events: none;
    }
    .version-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Buttons */
    .btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,.05); color: var(--text); transition: background .15s; }
    .btn:hover { background: rgba(255,255,255,.1); }
    .btn.green { border-color: rgba(66,211,165,.4); color: var(--accent-2); background: rgba(66,211,165,.08); }
    .btn.green:hover { background: rgba(66,211,165,.16); }
    .btn.red { border-color: rgba(255,107,107,.3); color: var(--danger); background: rgba(255,107,107,.07); }
    .btn.red:hover { background: rgba(255,107,107,.14); }
    .btn.yellow { border-color: rgba(255,204,77,.3); color: var(--accent); background: rgba(255,204,77,.08); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px; width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto; display: grid; gap: 14px;
    }
    .modal h2 { font-size: 17px; font-weight: 800; }
    .modal label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 5px; }
    .modal input, .modal textarea {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px;
      padding: 10px 12px; outline: none;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--accent-2); }
    .modal textarea { min-height: 140px; resize: vertical; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.7; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions .btn-cancel { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,.05); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-actions .btn-save { padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent-2); color: #101418; font-size: 14px; font-weight: 700; cursor: pointer; }
    .error-msg { font-size: 13px; color: var(--danger); min-height: 18px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #2a3140; border: 1px solid var(--border); color: var(--text);
      padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
      z-index: 200; transition: transform .25s ease; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .divider { border: none; border-top: 1px solid var(--border); }
    .hint { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a href="/" class="back-btn">← 返回</a>
    <h1>🎵 歌曲提示词库</h1>
    <button class="admin-btn" id="adminBtn">🔐 管理</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" class="search-input" id="searchInput" placeholder="搜索歌名、歌手…（中日文均可）" autocomplete="off" autocorrect="off">
    <button class="search-clear" id="searchClear">×</button>
  </div>

  <div class="admin-toolbar" id="adminToolbar">
    <span>🔑 管理员模式</span>
    <button class="btn-add-song" id="addSongBtn">＋ 新建歌曲</button>
  </div>

  <div id="songList"></div>
</div>

<!-- Add/Edit Song Modal -->
<div class="modal-overlay" id="songModal">
  <div class="modal">
    <h2 id="songModalTitle">新建歌曲</h2>
    <div>
      <label>歌曲名 *</label>
      <input type="text" id="songTitleInput" placeholder="例：シュガー" autocomplete="off">
    </div>
    <div>
      <label>歌手 / 团体</label>
      <input type="text" id="songArtistInput" placeholder="例：Ayumu Imazu" autocomplete="off">
    </div>
    <div class="error-msg" id="songModalError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="songModalCancel">取消</button>
      <button class="btn-save" id="songModalSave">保存</button>
    </div>
  </div>
</div>

<!-- Add/Edit Version Modal -->
<div class="modal-overlay" id="verModal">
  <div class="modal">
    <h2 id="verModalTitle">添加版本</h2>
    <div>
      <label>版本标签</label>
      <input type="text" id="verLabelInput" placeholder="例：完整版、Cut 版、练习版" autocomplete="off">
    </div>
    <div>
      <label>振付 / 编舞</label>
      <input type="text" id="verChoreographerInput" placeholder="例：Kento Mok" autocomplete="off">
    </div>
    <div>
      <label>提示词内容 *</label>
      <textarea id="verCuesInput" placeholder="00:04, 开场, 全景&#10;00:23, 小林, 左侧特写&#10;..."></textarea>
    </div>
    <div class="error-msg" id="verModalError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="verModalCancel">取消</button>
      <button class="btn-save" id="verModalSave">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────
let adminKey = sessionStorage.getItem('adminKey') || '';
let isAdmin = false;
let songs = [];

// ── Helpers ───────────────────────────────────────
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}

function cueLineCount(cues) {
  return (cues || '').split('\n').filter(l => l.trim()).length;
}

async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ── Admin ─────────────────────────────────────────
const adminBtn = document.getElementById('adminBtn');
const adminToolbar = document.getElementById('adminToolbar');

adminBtn.addEventListener('click', () => {
  if (isAdmin) {
    // Log out
    isAdmin = false;
    adminKey = '';
    sessionStorage.removeItem('adminKey');
    adminBtn.classList.remove('active');
    adminBtn.textContent = '🔐 管理';
    adminToolbar.classList.remove('visible');
    renderSongs();
    return;
  }
  const key = prompt('请输入管理员密钥：');
  if (!key) return;
  adminKey = key;
  sessionStorage.setItem('adminKey', key);
  isAdmin = true;
  adminBtn.classList.add('active');
  adminBtn.textContent = '✓ 管理中';
  adminToolbar.classList.add('visible');
  renderSongs();
  showToast('已进入管理员模式');
});

// Auto-restore admin session
if (adminKey) {
  isAdmin = true;
  adminBtn.classList.add('active');
  adminBtn.textContent = '✓ 管理中';
  adminToolbar.classList.add('visible');
}

// ── Search ────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
let searchTimer = null;

searchInput.addEventListener('input', () => {
  searchClear.style.display = searchInput.value ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadSongs(searchInput.value), 280);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  loadSongs('');
});

// ── Load songs ────────────────────────────────────
async function loadSongs(q = '') {
  const list = document.getElementById('songList');
  list.innerHTML = '<p class="status-msg"><span class="emoji">⏳</span>加载中…</p>';
  try {
    const qs = q ? `?q=${encodeURIComponent(q)}` : '';
    songs = await api('GET', `/api/songs${qs}`);
    renderSongs();
  } catch (e) {
    list.innerHTML = `<p class="status-msg"><span class="emoji">❌</span>${e.message}</p>`;
  }
}

// ── Render ────────────────────────────────────────
function renderSongs() {
  const list = document.getElementById('songList');
  if (!songs.length) {
    const q = searchInput.value.trim();
    list.innerHTML = `<p class="status-msg"><span class="emoji">${q ? '🔍' : '🎵'}</span>${q ? `没有找到「${q}」的结果` : '暂无歌曲，管理员可添加'}</p>`;
    return;
  }
  list.innerHTML = '';
  songs.forEach(song => list.appendChild(buildSongCard(song)));
}

function buildSongCard(song) {
  const card = document.createElement('div');
  card.className = 'song-card';
  card.dataset.id = song._id;

  const verCount = song.versions?.length || 0;

  card.innerHTML = `
    <div class="song-header">
      <div class="song-info">
        <div class="song-title">${esc(song.title)}</div>
        ${song.artist ? `<div class="song-artist">${esc(song.artist)}</div>` : ''}
      </div>
      <div class="song-meta">
        <span class="ver-count">${verCount} 个版本</span>
        <span class="expand-icon">▼</span>
      </div>
    </div>
    ${isAdmin ? `
    <div class="song-admin-row visible">
      <button class="btn sm yellow" data-action="edit-song">编辑歌曲</button>
      <button class="btn sm green" data-action="add-version">＋ 添加版本</button>
      <button class="btn sm red" data-action="del-song">删除歌曲</button>
    </div>` : ''}
    <div class="versions-list">
      ${(song.versions || []).map(v => buildVersionHTML(song._id, v)).join('')}
      ${verCount === 0 ? '<p class="hint" style="padding:14px 16px;">暂无版本</p>' : ''}
    </div>
  `;

  // Toggle open/close
  card.querySelector('.song-header').addEventListener('click', () => {
    card.classList.toggle('open');
  });

  // Admin song actions
  card.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      if (action === 'edit-song') openEditSongModal(song);
      if (action === 'add-version') openAddVersionModal(song._id);
      if (action === 'del-song') deleteSong(song._id, song.title);
    });
  });

  // Version actions (copy, expand, admin)
  card.querySelectorAll('[data-vid]').forEach(el => {
    const vid = el.dataset.vid;
    const ver = song.versions.find(v => v._id === vid);
    const action = el.dataset.vaction;
    if (!ver) return;

    el.addEventListener('click', () => {
      if (action === 'copy') {
        navigator.clipboard.writeText(ver.cues || '').then(() => showToast('✓ 已复制到剪贴板'));
      }
      if (action === 'expand') {
        const preview = card.querySelector(`[data-preview="${vid}"]`);
        const fade = card.querySelector(`[data-fade="${vid}"]`);
        preview?.classList.toggle('expanded');
        if (fade) fade.style.display = preview?.classList.contains('expanded') ? 'none' : 'block';
        el.textContent = preview?.classList.contains('expanded') ? '收起' : '展开全部';
      }
      if (action === 'edit-ver') openEditVersionModal(song._id, ver);
      if (action === 'del-ver') deleteVersion(song._id, vid, song.title);
    });
  });

  return card;
}

function buildVersionHTML(songId, v) {
  const lines = cueLineCount(v.cues);
  const preview = (v.cues || '').split('\n').slice(0, 6).join('\n');
  const needsExpand = (v.cues || '').split('\n').length > 6;
  return `
    <div class="version-item">
      <div class="version-header">
        <div class="version-tags">
          ${v.label ? `<span class="tag label">${esc(v.label)}</span>` : ''}
          ${v.choreographer ? `<span class="tag choreo">振付：${esc(v.choreographer)}</span>` : ''}
          <span class="tag">${lines} 条提示</span>
        </div>
        <div class="version-date">${fmtDate(v.createdAt)}</div>
      </div>
      <div class="cue-preview" data-preview="${v._id}">${esc(preview)}${needsExpand ? '<div class="cue-preview-fade" data-fade="' + v._id + '"></div>' : ''}</div>
      <div class="version-actions">
        <button class="btn green" data-vid="${v._id}" data-vaction="copy">📋 复制提示词</button>
        ${needsExpand ? `<button class="btn" data-vid="${v._id}" data-vaction="expand">展开全部</button>` : ''}
        ${isAdmin ? `
          <button class="btn yellow sm" data-vid="${v._id}" data-vaction="edit-ver">编辑</button>
          <button class="btn red sm" data-vid="${v._id}" data-vaction="del-ver">删除</button>
        ` : ''}
      </div>
    </div>
  `;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

// ── Song Modal ────────────────────────────────────
let editingSongId = null;

function openAddSongModal() {
  editingSongId = null;
  document.getElementById('songModalTitle').textContent = '新建歌曲';
  document.getElementById('songTitleInput').value = '';
  document.getElementById('songArtistInput').value = '';
  document.getElementById('songModalError').textContent = '';
  document.getElementById('songModal').classList.add('open');
  document.getElementById('songTitleInput').focus();
}

function openEditSongModal(song) {
  editingSongId = song._id;
  document.getElementById('songModalTitle').textContent = '编辑歌曲';
  document.getElementById('songTitleInput').value = song.title;
  document.getElementById('songArtistInput').value = song.artist || '';
  document.getElementById('songModalError').textContent = '';
  document.getElementById('songModal').classList.add('open');
}

document.getElementById('addSongBtn').addEventListener('click', openAddSongModal);
document.getElementById('songModalCancel').addEventListener('click', () => {
  document.getElementById('songModal').classList.remove('open');
});

document.getElementById('songModalSave').addEventListener('click', async () => {
  const title = document.getElementById('songTitleInput').value.trim();
  const artist = document.getElementById('songArtistInput').value.trim();
  const errEl = document.getElementById('songModalError');
  if (!title) { errEl.textContent = '请输入歌曲名'; return; }
  errEl.textContent = '';
  try {
    if (editingSongId) {
      await api('PATCH', `/api/songs/${editingSongId}`, { title, artist });
      showToast('✓ 歌曲已更新');
    } else {
      await api('POST', '/api/songs', { title, artist });
      showToast('✓ 歌曲已创建');
    }
    document.getElementById('songModal').classList.remove('open');
    loadSongs(searchInput.value);
  } catch (e) { errEl.textContent = e.message; }
});

async function deleteSong(id, title) {
  if (!confirm(`确定删除「${title}」及其所有版本？此操作不可撤销。`)) return;
  try {
    await api('DELETE', `/api/songs/${id}`);
    showToast('已删除');
    loadSongs(searchInput.value);
  } catch (e) { showToast('❌ ' + e.message, 3000); }
}

// ── Version Modal ─────────────────────────────────
let editingVersionSongId = null;
let editingVersionId = null;

function openAddVersionModal(songId) {
  editingVersionSongId = songId;
  editingVersionId = null;
  document.getElementById('verModalTitle').textContent = '添加版本';
  document.getElementById('verLabelInput').value = '';
  document.getElementById('verChoreographerInput').value = '';
  document.getElementById('verCuesInput').value = '';
  document.getElementById('verModalError').textContent = '';
  document.getElementById('verModal').classList.add('open');
  document.getElementById('verCuesInput').focus();
}

function openEditVersionModal(songId, ver) {
  editingVersionSongId = songId;
  editingVersionId = ver._id;
  document.getElementById('verModalTitle').textContent = '编辑版本';
  document.getElementById('verLabelInput').value = ver.label || '';
  document.getElementById('verChoreographerInput').value = ver.choreographer || '';
  document.getElementById('verCuesInput').value = ver.cues || '';
  document.getElementById('verModalError').textContent = '';
  document.getElementById('verModal').classList.add('open');
}

document.getElementById('verModalCancel').addEventListener('click', () => {
  document.getElementById('verModal').classList.remove('open');
});

document.getElementById('verModalSave').addEventListener('click', async () => {
  const label = document.getElementById('verLabelInput').value.trim();
  const choreographer = document.getElementById('verChoreographerInput').value.trim();
  const cues = document.getElementById('verCuesInput').value.trim();
  const errEl = document.getElementById('verModalError');
  if (!cues) { errEl.textContent = '提示词内容不能为空'; return; }
  errEl.textContent = '';
  try {
    if (editingVersionId) {
      await api('PATCH', `/api/songs/${editingVersionSongId}/versions/${editingVersionId}`, { label, choreographer, cues });
      showToast('✓ 版本已更新');
    } else {
      await api('POST', `/api/songs/${editingVersionSongId}/versions`, { label, choreographer, cues });
      showToast('✓ 版本已添加');
    }
    document.getElementById('verModal').classList.remove('open');
    loadSongs(searchInput.value);
  } catch (e) { errEl.textContent = e.message; }
});

async function deleteVersion(songId, vid, songTitle) {
  if (!confirm(`确定删除这个版本？`)) return;
  try {
    await api('DELETE', `/api/songs/${songId}/versions/${vid}`);
    showToast('已删除');
    loadSongs(searchInput.value);
  } catch (e) { showToast('❌ ' + e.message, 3000); }
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── Init ──────────────────────────────────────────
loadSongs();
</script>
</body>
</html>
